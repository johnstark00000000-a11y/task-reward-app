<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 20px; max-width: 900px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        h1, h2, h3 { color: #ff9800; margin-bottom: 15px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
        button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #f57c00; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #2a2a2a; border-radius: 8px; padding: 15px; text-align: center; border-left: 4px solid #ff9800; }
        .stat-card h2 { font-size: 28px; color: #fff; margin-top: 5px; }
        .item-row { background: #2a2a2a; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 320px; text-align: center; }
        .msg { padding: 10px; border-radius: 5px; margin-bottom: 10px; display: none; }
        .msg.show { display: block; }
        .msg.success { background: #4caf50; color: white; }
        .msg.error { background: #f44336; color: white; }
    </style>
</head>
<body>

    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay" class="overlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <div class="msg error" id="errorMsg"></div>
            <input type="password" id="adminPass" placeholder="Enter Password">
            <button onclick="login()">Login</button>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="dashboard" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Admin Control Panel</h1>
            <button onclick="logout()" style="width: auto; background: #ff5252; color: #fff; padding: 8px 16px;">Logout</button>
        </div>

        <div class="msg success" id="successMsg"></div>
        <div class="msg error" id="dashErrorMsg"></div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <span>Total Users</span>
                <h2 id="totalUsers">0</h2>
            </div>
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalTasks">0</h2>
            </div>
            <div class="stat-card">
                <span>Total Withdrawals</span>
                <h2 id="totalPayouts">₹0</h2>
            </div>
        </div>

        <!-- ADD TASK FORM -->
        <div class="card">
            <h3>Add New Task</h3>
            <input type="text" id="taskTitle" placeholder="Task Title (e.g. Subscribe Channel)">
            <input type="number" id="taskReward" placeholder="Reward Amount (₹)">
            <input type="text" id="taskUrl" placeholder="Task URL (optional)">
            <button id="addBtn" onclick="addTask()">Publish Task</button>
        </div>

        <!-- ACTIVE TASKS -->
        <div class="card">
            <h3>Active Tasks</h3>
            <button style="width: auto; background: #667eea; margin-bottom: 10px;" onclick="loadTasks()">🔄 Refresh</button>
            <div id="tasksList">Loading tasks...</div>
        </div>

        <!-- WITHDRAWALS -->
        <div class="card">
            <h3>Pending Withdrawals</h3>
            <button style="width: auto; background: #667eea; margin-bottom: 10px;" onclick="loadWithdrawals()">🔄 Refresh</button>
            <div id="withdrawalsList">Loading withdrawals...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://task-reward-app.onrender.com';
        const ADMIN_PASS = 'Asr@1234';

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'x-admin-key': ADMIN_PASS
            };
        }

        function showMsg(type, msg) {
            const elem = type === 'success' ? document.getElementById('successMsg') : document.getElementById('dashErrorMsg');
            elem.innerText = msg;
            elem.classList.add('show', type);
            setTimeout(() => elem.classList.remove('show'), 4000);
        }

        window.onload = () => {
            if (localStorage.getItem('adminAuth') === ADMIN_PASS) showDashboard();
        };

        function login() {
            const pass = document.getElementById('adminPass').value;
            if (pass === ADMIN_PASS) {
                localStorage.setItem('adminAuth', ADMIN_PASS);
                showDashboard();
            } else {
                const msg = document.getElementById('errorMsg');
                msg.innerText = 'Wrong password!';
                msg.classList.add('show');
            }
        }

        function showDashboard() {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadStats();
            loadTasks();
            loadWithdrawals();
            setInterval(loadStats, 10000);
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/api/admin/stats`, { headers: getHeaders() });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('totalUsers').innerText = data.stats.totalUsers || 0;
                    document.getElementById('totalTasks').innerText = data.stats.totalTasks || 0;
                    document.getElementById('totalPayouts').innerText = `₹${data.stats.totalWithdrawals || 0}`;
                }
            } catch (err) { console.error(err); }
        }

        async function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const amount = document.getElementById('taskReward').value.trim();
            const url = document.getElementById('taskUrl').value.trim();
            const btn = document.getElementById('addBtn');

            if (!title || !amount) {
                showMsg('error', 'Please fill Title and Reward!');
                return;
            }

            btn.innerText = 'Publishing...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/admin/tasks`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ 
                        title, 
                        amount: Number(amount), 
                        reward: Number(amount), 
                        url,
                        description: "Complete this task"
                    })
                });

                const data = await res.json();
                if (data.success) {
                    showMsg('success', '✅ Task Published!');
                    document.getElementById('taskTitle').value = '';
                    document.getElementById('taskReward').value = '';
                    document.getElementById('taskUrl').value = '';
                    setTimeout(() => { loadTasks(); loadStats(); }, 500);
                } else {
                    showMsg('error', 'Error: ' + data.error);
                }
            } catch (err) {
                showMsg('error', 'Error: ' + err.message);
            } finally {
                btn.innerText = 'Publish Task';
                btn.disabled = false;
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch(`${API_URL}/api/tasks`);
                const data = await res.json();
                const container = document.getElementById('tasksList');
                container.innerHTML = '';

                const tasks = data.tasks || [];
                if (tasks.length > 0) {
                    tasks.forEach(t => {
                        container.innerHTML += `
                            <div class="item-row">
                                <div>
                                    <strong>${t.title}</strong><br>
                                    <small style="color:#aaa;">₹${t.amount} | ${t.url || 'No link'}</small>
                                </div>
                                <span style="color:#4caf50;">✓</span>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="color:#aaa;">No tasks yet</p>';
                }
            } catch (err) { 
                document.getElementById('tasksList').innerHTML = '<p style="color:#ff5252;">Error loading tasks</p>';
            }
        }

        async function loadWithdrawals() {
            try {
                const res = await fetch(`${API_URL}/api/admin/withdrawals`, { headers: getHeaders() });
                const data = await res.json();
                const container = document.getElementById('withdrawalsList');
                container.innerHTML = '';

                const withdrawals = data.withdrawals || [];
                if (withdrawals.length > 0) {
                    withdrawals.forEach(w => {
                        container.innerHTML += `
                            <div class="item-row">
                                <div>
                                    <strong>₹${w.amount}</strong><br>
                                    <small style="color:#aaa;">${w.userEmail} | ${w.upi}</small>
                                </div>
                                <span style="background:#ff9800;padding:4px 8px;border-radius:4px;font-size:11px;">PENDING</span>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="color:#aaa;">No pending withdrawals</p>';
                }
            } catch (err) { 
                document.getElementById('withdrawalsList').innerHTML = '<p style="color:#ff5252;">Error loading withdrawals</p>';
            }
        }

        function logout() {
            localStorage.removeItem('adminAuth');
            location.reload();
        }
    </script>
</body>
</html>
