<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Control Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        h1, h2, h3 { color: #ff9800; margin-bottom: 15px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
        button { background: #ff9800; color: #000; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #f57c00; }
        button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #2a2a2a; border-radius: 8px; padding: 15px; text-align: center; border-left: 4px solid #ff9800; }
        .stat-card h2 { font-size: 28px; color: #fff; margin-top: 5px; }
        .item-row { background: #2a2a2a; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .hidden { display: none !important; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 999; }
        .login-box { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 320px; text-align: center; }
    </style>
</head>
<body>

    <!-- ADMIN LOGIN OVERLAY -->
    <div id="adminLoginOverlay" class="overlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <p id="adminPassError" style="color:#ff5252; font-size:13px; margin-bottom:10px;"></p>
            <input type="password" id="adminPasscode" placeholder="Enter Admin Passcode">
            <button onclick="unlockAdminPanel()">Access Dashboard</button>
        </div>
    </div>

    <!-- ADMIN MAIN DASHBOARD -->
    <div id="adminDashboard" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Admin Control Panel</h1>
            <button onclick="lockAdminPanel()" style="width: auto; background: #ff5252; color: #fff; padding: 8px 16px;">Logout</button>
        </div>

        <!-- STATS OVERVIEW -->
        <div class="stats-grid">
            <div class="stat-card">
                <span>Total Users</span>
                <h2 id="totalUsers">0</h2>
            </div>
            <div class="stat-card">
                <span>Total Payouts</span>
                <h2 id="totalPayouts">₹0</h2>
            </div>
        </div>

        <!-- ADD TASK -->
        <div class="card">
            <h3>Add New Task</h3>
            <input type="text" id="taskTitle" placeholder="Task Title (e.g. Subscribe Channel)">
            <input type="number" id="taskReward" placeholder="Reward Amount (₹)">
            <input type="text" id="taskLink" placeholder="Task Target URL">
            <button id="addBtn" onclick="addNewTask()">Publish Task</button>
        </div>

        <!-- MANAGE TASKS -->
        <div class="card">
            <h3>Active Tasks</h3>
            <div id="adminTaskList">Loading...</div>
        </div>

        <!-- PAYOUT REQUESTS -->
        <div class="card">
            <h3>Pending Withdrawals</h3>
            <div id="withdrawalList">Loading...</div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://task-reward-app.onrender.com'; // Live Render Backend Link
        const ADMIN_SECRET = 'Asr@1234'; // Master Passcode

        // Helper Function for Headers
        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'x-admin-key': ADMIN_SECRET,
                'Authorization': `Bearer ${ADMIN_SECRET}`
            };
        }

        window.onload = function() {
            const isAuth = localStorage.getItem('adminAuth');
            if (isAuth === ADMIN_SECRET) showDashboard();
        };

        function unlockAdminPanel() {
            const inputPass = document.getElementById('adminPasscode').value;
            const errBox = document.getElementById('adminPassError');

            if (inputPass === ADMIN_SECRET) {
                localStorage.setItem('adminAuth', ADMIN_SECRET);
                showDashboard();
            } else {
                errBox.innerText = 'Incorrect Admin Passcode!';
            }
        }

        function showDashboard() {
            document.getElementById('adminLoginOverlay').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadAdminStats();
            loadAdminTasks();
            loadWithdrawals();
        }

        async function loadAdminStats() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/stats`, {
                    headers: getHeaders()
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('totalUsers').innerText = data.stats.totalUsers || 0;
                    document.getElementById('totalPayouts').innerText = `₹${data.stats.totalPayouts || 0}`;
                }
            } catch (err) { console.error(err); }
        }

        async function addNewTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const amount = document.getElementById('taskReward').value.trim();
            const url = document.getElementById('taskLink').value.trim();
            const btn = document.getElementById('addBtn');

            if (!title || !amount) return alert('Please fill in Title and Reward Amount!');

            btn.innerText = 'Publishing... (Please Wait)';
            btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/tasks/add`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ title, amount: Number(amount), url })
                });

                const data = await res.json();

                if (res.ok && (data.success || data._id || data.task)) {
                    alert('✅ Task Added Successfully!');
                    document.getElementById('taskTitle').value = '';
                    document.getElementById('taskReward').value = '';
                    document.getElementById('taskLink').value = '';
                    loadAdminTasks();
                } else {
                    alert('❌ Backend Error: ' + (data.error || data.message || 'Unauthorized Action'));
                }
            } catch (err) {
                alert('⚠️ Server Timeout: Render server jaag rha hai. 20-30 sec baad fir se "Publish Task" dabayein!');
            } finally {
                btn.innerText = 'Publish Task';
                btn.disabled = false;
            }
        }

        async function loadAdminTasks() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/tasks`);
                const data = await res.json();
                const taskContainer = document.getElementById('adminTaskList');
                taskContainer.innerHTML = '';

                const taskList = Array.isArray(data) ? data : (data.tasks || []);

                if (taskList.length > 0) {
                    taskList.forEach(t => {
                        taskContainer.innerHTML += `
                            <div class="item-row">
                                <div>
                                    <strong>${t.title}</strong> — ₹${t.amount}
                                </div>
                                <button onclick="deleteTask('${t._id}')" style="width:auto; padding:5px 10px; background:#ff5252; color:#fff;">Delete</button>
                            </div>
                        `;
                    });
                } else {
                    taskContainer.innerHTML = '<p style="color:#aaa; font-size:13px;">No active tasks found.</p>';
                }
            } catch (err) { console.error(err); }
        }

        async function deleteTask(id) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/tasks/delete/${id}`, {
                    method: 'DELETE',
                    headers: getHeaders()
                });
                loadAdminTasks();
            } catch (err) { alert('Delete failed!'); }
        }

        async function loadWithdrawals() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/admin/withdrawals`, {
                    headers: getHeaders()
                });
                const data = await res.json();
                const container = document.getElementById('withdrawalList');
                container.innerHTML = '';

                const withdrawals = Array.isArray(data) ? data : (data.withdrawals || []);

                if (withdrawals.length > 0) {
                    withdrawals.forEach(w => {
                        container.innerHTML += `
                            <div class="item-row">
                                <div>
                                    <strong>₹${w.amount}</strong> (${w.upi})<br>
                                    <small style="color:#aaa;">User: ${w.userEmail}</small>
                                </div>
                                <div>
                                    <button onclick="updateWithdrawal('${w._id}', 'approved')" style="width:auto; padding:5px 8px; background:#00e676; color:#000;">Approve</button>
                                    <button onclick="updateWithdrawal('${w._id}', 'rejected')" style="width:auto; padding:5px 8px; background:#ff5252; color:#fff;">Reject</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="color:#aaa; font-size:13px;">No pending requests.</p>';
                }
            } catch (err) { console.error(err); }
        }

        async function updateWithdrawal(id, status) {
            try {
                await fetch(`${BACKEND_URL}/api/admin/withdrawals/update`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ withdrawalId: id, status })
                });
                loadWithdrawals();
                loadAdminStats();
            } catch (err) { alert('Action failed!'); }
        }

        function lockAdminPanel() {
            localStorage.removeItem('adminAuth');
            location.reload();
        }
    </script>
</body>
</html>
